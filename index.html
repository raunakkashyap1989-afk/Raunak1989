<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Bomb Call Tool (91+)</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #0d0d0d; color: #00ff00; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; border: 1px solid #00ff00; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px #00ff00; }
        input { width: 80%; padding: 10px; margin: 10px 0; background: #1a1a1a; border: 1px solid #00ff00; color: white; font-size: 16px; text-align: center; }
        button { background: #00ff00; color: black; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #00cc00; }
        #log { height: 200px; overflow-y: scroll; text-align: left; border: 1px dashed #333; padding: 10px; margin-top: 20px; font-size: 14px; background: #000; }
        .error { color: red; }
        .success { color: cyan; }
    </style>
</head>
<body>

<div class="container">
    <h2>📞 T-BOMB CALLER (91+)</h2>
    <p>Enter Target Number (Start with 91):</p>
    <input type="number" id="targetNumber" placeholder="e.g., 919876543210">
    <br>
    <button onclick="startBomb()">START BOMB</button>
    
    <div id="log"></div>
</div>

<script>
    let isRunning = false;

    function log(message, type = '') {
        const logDiv = document.getElementById('log');
        const p = document.createElement('p');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        if(type === 'error') p.className = 'error';
        if(type === 'success') p.className = 'success';
        logDiv.prepend(p);
    }

    async function startBomb() {
        if (isRunning) return;
        
        const numInput = document.getElementById('targetNumber').value.trim();
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = ''; // Clear previous logs

        // Validation for 91+ format
        if (!numInput.startsWith('91') || numInput.length !== 12 || isNaN(numInput)) {
            log("Invalid Format! Must be 91XXXXXXXXXX", "error");
            return;
        }

        isRunning = true;
        log(`Target Locked: +${numInput}`);
        log("Connecting to Gateway...");

        // SIMULATION OF REAL CALLS
        // Note: Real calls require an API Key (Twilio/Exotel). 
        // Since we don't have your private API key here, this simulates the traffic.
        
        const totalCalls = 10; // Change this number to send more calls
        
        for (let i = 1; i <= totalCalls; i++) {
            const randomCaller = "+91" + Math.floor(1000000000 + Math.random() * 9000000000);
            
            log(`Sending Call #${i} from: ${randomCaller}...`);
            
            // Simulate network delay
            await new Promise(r => setTimeout(r, 2000)); 
            
            log(`✅ Call Connected! Duration: 0:30s`, "success");
            
            // Wait before next call
            await new Promise(r => setTimeout(r, 1000));
        }

        log("TBOMB Completed Successfully.", "success");
        isRunning = false;
    }
</script>

</body>
</html>
